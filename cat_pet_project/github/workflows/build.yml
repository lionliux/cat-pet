name: 打包 Windows EXE

on:
  # 当你 push 代码到 main 分支时自动触发
  push:
    branches: [ main ]
  # 也可以手动触发
  workflow_dispatch:

jobs:
  build:
    # 使用 Windows 环境
    runs-on: windows-latest
    
    steps:
    # 1. 检出代码
    - uses: actions/checkout@v4
    
    # 2. 设置 Python
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    # 3. 安装依赖
    - name: 安装依赖库
      run: |
        pip install pillow pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple
    
    # 4. 预处理图片（自动抠图）
    - name: 预处理图片
      run: |
        python preprocess_images.py
    
    # 5. 打包成 EXE
    - name: 打包 EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "加菲猫桌宠" --add-data "assets;assets" cat_pet.py
    
    # 6. 上传打包好的文件
    - name: 上传 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: 加菲猫桌宠
        path: dist/加菲猫桌宠.exe
